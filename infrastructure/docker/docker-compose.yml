services:
  postgres:
    image: postgres:17
    container_name: scorefilm-postgres
    environment:
      POSTGRES_USER: scorefilm_admin
      POSTGRES_PASSWORD: _ScoreFilm2026
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:8
    container_name: scorefilm-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:8
    container_name: scorefilm-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  mongo_data: