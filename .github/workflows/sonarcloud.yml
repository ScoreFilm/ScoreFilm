
name: SonarCloud - Auth Service

on:
  push:
    branches: [ "main" ]
    paths:
      - "auth-service/**"
      - ".github/workflows/sonarcloud.yml"

  pull_request:
    branches: [ "main" ]
    paths:
      - "auth-service/**"
      - ".github/workflows/sonarcloud.yml"

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  analysis:
    name: Test and analyze auth-service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Run tests and generate JaCoCo report
        working-directory: auth-service
        run: bash ./gradlew clean test jacocoTestReport

      - name: Analyze with SonarCloud
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: auth-service
          args: >
            -Dsonar.projectKey=ScoreFilm_ScoreFilm
            -Dsonar.organization=scorefilm
            -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
            -Dsonar.test.inclusions=src/test/**
            -Dsonar.exclusions=build/**,.gradle/**,src/jmh/**
            -Dsonar.java.binaries=build/classes/java/main
            -Dsonar.java.test.binaries=build/classes/java/test
            -Dsonar.junit.reportPaths=build/test-results/test
            -Dsonar.java.libraries=/home/runner/.gradle/caches/modules-2/files-2.1/**/*.jar
            -Dsonar.java.test.libraries=/home/runner/.gradle/caches/modules-2/files-2.1/**/*.jar

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-reports
          path: |
            auth-service/build/reports/jacoco/test/html
            auth-service/build/reports/tests/test
          retention-days: 7
